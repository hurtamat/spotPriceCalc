<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <title>SpotSteer</title>
  <!-- The SpotSteer mark on its own tile. Same geometry as spotsteer-mark.svg, sized up so the
       ring survives a 16px favicon: the dial gap and the marker dot are the recognisable part. -->
