  <circle cx="50" cy="52" r="27" fill="none" stroke="#1B7EA6" stroke-width="13" stroke-dasharray="119 51" stroke-linecap="round" />
  <circle cx="67" cy="30" r="11" fill="#E8952B" />
</svg>
