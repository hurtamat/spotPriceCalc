<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/spotsteer-mark.svg" />
    <meta name="theme-color" content="#0f1418" />
    <meta name="color-scheme" content="dark" />

    <!-- The tab label before React boots. usePageTitle takes over per route; this is
         what a crawler and a cold first paint see. -->
    <title>SpotSteer</title>
    <meta
      name="description"
      content="See the hourly spot price for your European bidding zone, and let SpotSteer run your EV charger, boiler and heat pump in the cheap hours. Works with Home Assistant and Shelly. No new hardware."
    />
    <link rel="canonical" href="https://spotsteer.eu/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SpotSteer" />
    <meta property="og:title" content="SpotSteer: automate your home energy against spot prices" />
    <meta
      property="og:description"
      content="See the hourly spot price for your European bidding zone, and let SpotSteer run your devices in the cheap hours."
    />
    <meta property="og:image" content="https://spotsteer.eu/assets/backdrop.png" />
    <meta property="og:image:width" content="640" />
    <meta property="og:image:height" content="256" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Both site faces are self-hosted (see the @font-face block in spotsteer.css), so the
         first paint waits on nothing from fonts.googleapis.com. The hero headline is painted
         in Space Grotesk, so that file is preloaded ahead of the stylesheet that asks for it. -->
    <link
      rel="preload"
      href="/fonts/spacegrotesk-var-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="preload" as="image" href="/assets/backdrop.png" fetchpriority="high" />

    <!-- Appliance glyphs for /savings. Self-hosted like the text faces: the eight-icon subset,
         downloaded once into /fonts. Hotlinking fonts.googleapis.com would hand every visitor's
         IP to Google, and was the only reason this site would need a consent banner. -->
    <link
      rel="preload"
      href="/fonts/material-symbols-subset.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
