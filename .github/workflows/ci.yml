name: CI

# Verify every service builds, is formatted, lints clean and passes its tests.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore
      # Formatting is checked before the build so a whitespace slip fails fast.
      - run: dotnet format spotPriceCalc.sln --verify-no-changes --no-restore
      # Directory.Build.props turns warnings into errors, so a warning fails this step.
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release --logger "trx;LogFileName=results.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: error

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # oxlint --deny-warnings: a warning fails CI too.
      - run: npm run lint
      # tsc -b (type check) then vite build.
      - run: npm run build

  calc-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: calc-service
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: calc-service/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check --output-format=github .
      - run: ruff format --check .
      - run: pytest

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.9"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
